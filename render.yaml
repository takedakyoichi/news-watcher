services:
  - type: web
    name: eigyo-news-watcher
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    disk:
      name: db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/news.db
